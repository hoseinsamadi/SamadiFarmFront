services:
  db:
    image: postgres:16-alpine
    container_name: samadi-farm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-samadi_farm}
      POSTGRES_USER: ${POSTGRES_USER:-samadi_farm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-samadi_farm_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-samadi_farm} -d ${POSTGRES_DB:-samadi_farm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: samadi-farm-backend
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:-samadi_farm}
      POSTGRES_USER: ${POSTGRES_USER:-samadi_farm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-samadi_farm_dev}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: samadi-farm-frontend
    restart: unless-stopped
    command: npm run dev -- --hostname 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
  backend_static:
  frontend_node_modules:
  frontend_next:
